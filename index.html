:root{--pln-y:#FFEC00;--pln-r:#E71C24;--pln-b:#00AAEB;--deep:#021A2E;--ease:cubic-bezier(.16,1,.3,1);
  --display:"MK2 Display","Poppins","Segoe UI",system-ui,sans-serif;--strip:linear-gradient(90deg,var(--pln-y) 0 82%,var(--pln-r) 82% 86%,var(--pln-b) 86%)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:#fff;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;overflow:hidden;
  background:radial-gradient(900px 560px at 50% 46%,#05507E 0%,#03304F 42%,#021A2E 78%) fixed,#021A2E}
.gate{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.iwaves{position:absolute;left:-5%;width:110%;top:calc(50% + 120px);height:110px;overflow:visible;pointer-events:none}
.iwaves path{fill:none;stroke:var(--pln-b);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:idraw 1.1s var(--ease) forwards}
.iwaves path:nth-child(2){opacity:.65;animation-delay:.08s}
.iwaves path:nth-child(3){opacity:.4;animation-delay:.16s}
.ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:0 16px;margin-top:-60px}
.ibolt{position:absolute;left:50%;top:-150px;width:78px;height:170px;margin-left:-60px;overflow:visible;opacity:0;animation:ibolt .55s ease-out .28s forwards;pointer-events:none}
.ibolt path{fill:var(--pln-r);stroke:#FFF6A8;stroke-width:2;filter:drop-shadow(0 0 14px rgba(255,236,0,.9))}
.ilogo{width:min(300px,64vw);height:auto;opacity:0;transform:scale(.82);filter:blur(10px);animation:ilogo .8s var(--ease) .62s forwards}
.itxt{margin:6px 0 0;font-family:var(--display);font-weight:500;font-size:clamp(16px,2.4vw,21px);letter-spacing:.01em;opacity:0;transform:translateY(12px);animation:rise .7s var(--ease) 1s forwards}
.itxt span{display:block;font-size:.72em;color:#9FC9E2;font-weight:500;margin-top:2px}
.ibar{width:min(320px,70vw);height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:fadein .3s 1.05s forwards}
.ibar i{display:block;height:100%;background:var(--strip);transform-origin:left;transform:scaleX(0);transition:transform .6s var(--ease)}
.gate.busy .ibar i{animation:load 1.3s ease-in-out infinite}
.gate.ok .ibar i{animation:none;transform:scaleX(1)}
.inum{margin:0;font-size:13px;color:#B9D5E5;min-height:1.3em;opacity:0;animation:fadein .4s 1.25s forwards}
.iflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff,rgba(255,250,200,.6) 30%,transparent 70%);opacity:0;animation:iflash .6s ease-out .42s;pointer-events:none}
.card{position:absolute;top:100%;left:50%;width:min(380px,calc(100vw - 32px));margin:18px 0 0 calc(min(380px,calc(100vw - 32px)) / -2);padding:18px 18px 14px;border-radius:18px;text-align:left;
  background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.75),0 0 0 1px rgba(0,170,235,.12);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.gate.ask .card{opacity:1;transform:none;pointer-events:auto}
.gate.ok .card{opacity:0;transform:translateY(-8px);pointer-events:none}
.card .lk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:#D2E8F4;margin:0 0 12px}
.card .lk svg{flex:none}
.row{display:flex;gap:8px}
.card label.pl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;color:#fff;background:rgba(2,26,46,.6);border:1px solid rgba(255,255,255,.26);border-radius:11px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=password]:focus,input[type=text]:focus{border-color:var(--pln-b);box-shadow:0 0 0 3px rgba(0,170,235,.3)}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:11px 18px;background:var(--pln-y);color:var(--deep);cursor:pointer;box-shadow:0 8px 22px -8px rgba(255,236,0,.6);transition:transform .15s,background-color .15s}
button:hover{background:#FFF36B}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.65;cursor:default}
:focus-visible{outline:3px solid var(--pln-y);outline-offset:2px}
.eye{display:flex;gap:7px;align-items:center;font-size:12.5px;color:#A9CDE2;margin-top:10px;cursor:pointer;width:max-content}
.eye input{margin:0}
.msg{min-height:1.3em;margin:8px 0 0;font-size:13px;color:#FFB3B6}
.fine{margin:8px 0 0;font-size:11.5px;line-height:1.45;color:#7FA7BF}
.gate.shake .card{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes ibolt{0%{opacity:0;transform:translateY(-40px) scaleY(.6)}35%{opacity:1;transform:none}55%{opacity:.35}70%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
@keyframes ilogo{to{opacity:1;transform:none;filter:none}}
@keyframes iflash{0%{opacity:0}18%{opacity:.75}100%{opacity:0}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes load{0%{transform:scaleX(.05);transform-origin:left}50%{transform:scaleX(.85);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(.05);transform-origin:right}}
@media (max-height:640px){.ic{margin-top:-170px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ilogo,.itxt,.ibar,.inum{opacity:1;transform:none;filter:none}.iwaves path{stroke-dashoffset:0}.ibolt,.iflash{display:none}}
noscript{position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#FFD8DA;font-size:14px}
</style>
